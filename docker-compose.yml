services:
  # Local MongoDB — only started when the `local-db` profile is active.
  # Use this for offline dev. If MONGO_URI is set in .env (e.g. Atlas), leave the
  # profile off and this service is skipped.
  mongo:
    image: mongo:7
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      # If MONGO_URI is set in .env (e.g. Atlas), it wins. Otherwise fall back
      # to the local `mongo` service (requires `--profile local-db`).
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-changeme}@mongo:27017/${MONGO_DB:-seraja}?authSource=admin}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE: ${JWT_EXPIRE}
      JWT_COOKIE_EXPIRE: ${JWT_COOKIE_EXPIRE}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5000/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:5000/api/v1}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
